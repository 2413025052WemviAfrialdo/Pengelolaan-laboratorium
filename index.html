<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Viewer Lab - Wemvi Afrialdo</title>

    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme"> 
    <div class="mobile-nav">
        <button class="menu-toggle" id="mobile-menu-btn" title="Tampilkan Identitas & Download">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <div class="page-info">
            Hal. <strong id="page-num-mobile">0</strong> / <span id="page-count-mobile">0</span>
        </div>

        <div class="pdf-nav-mobile">
            <button class="btn-nav-mobile" id="prev-page-mobile">&larr;</button>
            <button class="btn-nav-mobile" id="next-page-mobile">&rarr;</button>
        </div>
    </div>

    <div class="sidebar" id="main-sidebar">
        <button class="close-sidebar-btn" id="mobile-close-btn">&times;</button>

        <div class="logo-container">
            <img src="profil.png" alt="Foto Profil Wemvi Afrialdo" class="logo-img" id="foto-profil">
        </div>

        <div class="identity-card">
            <h2>Wemvi Afrialdo</h2>
            <div class="identity-info">
                NPM: <strong>2413025052</strong><br>
                Program Studi: <strong>Pendidikan Teknologi Informasi</strong><br>
                Universitas Lampung
                <div class="divider"></div>
                Mata Kuliah:<br>
                <strong>Pengelolaan Laboratorium Komputer</strong>
            </div>
        </div>

        <a href="FIle_Document_SOP.pdf" download="SOP_Laboratorium_Wemvi_Afrialdo.pdf" class="btn-download">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            Unduh Dokumen
        </a>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <button class="btn-nav" id="prev-page" title="Bisa tekan tombol Panah Kiri di keyboard">
                &larr; Sebelumnya
            </button>
            
            <div class="page-info">
                Halaman: <strong id="page-num">0</strong> / <span id="page-count">0</span>
            </div>
            
            <button class="btn-nav" id="next-page" title="Bisa tekan tombol Panah Kanan di keyboard">
                Selanjutnya &rarr;
            </button>
        </div>

        <div class="canvas-container">
            <canvas id="pdf-render"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
