<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Viewer - Wemvi Afrialdo</title>

    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <button class="fab-profile" id="fab-profile-btn" title="Lihat Profil & Unduh">
        <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
    </button>

    <div class="profile-panel" id="profile-panel">
        <button class="close-panel-btn" id="close-panel-btn">&times;</button>

        <div class="logo-container">
            <img src="profil.png" alt="Foto Profil Wemvi Afrialdo" class="logo-img" id="foto-profil">
        </div>

        <div class="identity-card">
            <h2>Wemvi Afrialdo</h2>
            <div class="identity-info">
                NPM: <strong>2413025052</strong><br>
                Program Studi: <strong>Pendidikan Teknologi Informasi</strong><br>
                Universitas Lampung
                <div class="divider"></div>
                Mata Kuliah:<br>
                <strong>Pengelolaan Laboratorium Komputer</strong>
            </div>
        </div>

        <a href="FIle_Document_SOP.pdf" download="SOP_Laboratorium_Wemvi_Afrialdo.pdf" class="btn-download">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            Unduh Dokumen
        </a>
    </div>

    <div class="main-content">
        <div class="canvas-container">
            <canvas id="pdf-render"></canvas>
        </div>
    </div>

    <div class="floating-nav">
        <button class="btn-nav" id="prev-page" title="Sebelumnya (Panah Kiri)">
            &larr;
        </button>
        
        <div class="page-info">
            <strong id="page-num">0</strong> / <span id="page-count">0</span>
        </div>
        
        <button class="btn-nav" id="next-page" title="Selanjutnya (Panah Kanan)">
            &rarr;
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
